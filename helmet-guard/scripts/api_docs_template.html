<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}} · 接口文档</title>
<style>
:root {
  --bg: #f7f8fa;
  --surface: #ffffff;
  --surface-2: #f1f3f6;
  --text: #1c1f26;
  --text-2: #5a6172;
  --text-3: #8b91a1;
  --line: #e4e7ec;
  --primary: #2f6bff;
  --primary-soft: #eaf0ff;
  --get: #1f9d55;
  --post: #2f6bff;
  --put: #d9822b;
  --patch: #8250df;
  --delete: #d63b3b;
  --radius: 10px;
  --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 15px/1.7 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
    "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
}
.layout { display: flex; align-items: flex-start; }
.sidebar {
  width: 320px;
  flex: 0 0 320px;
  height: 100vh;
  overflow-y: auto;
  background: var(--surface);
  border-right: 1px solid var(--line);
  position: sticky;
  top: 0;
  padding-bottom: 40px;
}
.side-head { padding: 20px 18px 14px; border-bottom: 1px solid var(--line); }
.side-title { font-size: 17px; font-weight: 650; margin: 0 0 4px; }
.side-sub { font-size: 13px; color: var(--text-3); margin: 0; }
.search-wrap { padding: 12px 14px; border-bottom: 1px solid var(--line); }
.search {
  width: 100%;
  padding: 9px 11px;
  font-size: 14px;
  font-family: inherit;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--surface-2);
  color: var(--text);
  outline: none;
}
.search:focus { border-color: var(--primary); background: var(--surface); }
.nav-group { padding: 10px 0 4px; }
.nav-tag {
  padding: 6px 18px;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: .04em;
  color: var(--text-3);
  text-transform: uppercase;
}
.nav-item {
  display: flex;
  gap: 8px;
  align-items: flex-start;
  padding: 6px 18px;
  color: var(--text-2);
  text-decoration: none;
  font-size: 13px;
  line-height: 1.55;
}
.nav-item:hover { background: var(--primary-soft); color: var(--primary); }
.nav-item.hidden { display: none; }
.nav-item .m { flex: 0 0 46px; text-align: center; padding: 2px 0; font-size: 10px; }
.nav-path {
  font-family: var(--mono);
  font-size: 12px;
  word-break: break-all;
  min-width: 0;
  flex: 1 1 auto;
}
.main { flex: 1 1 auto; min-width: 0; padding: 32px 40px 80px; }
.hero {
  background: var(--surface);
  border-radius: var(--radius);
  padding: 28px 30px;
  margin-bottom: 22px;
  border: 1px solid var(--line);
}
.hero h1 {
  margin: 0 0 6px;
  font-size: 26px;
  font-weight: 650;
  letter-spacing: -.01em;
}
.hero-meta { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
.hero-desc { color: var(--text-2); font-size: 14px; }
.hero-desc h3 { font-size: 15px; margin: 18px 0 6px; color: var(--text); }
.hero-desc ul { margin: 6px 0; padding-left: 20px; }
.hero-desc code {
  font-family: var(--mono);
  font-size: 12.5px;
  background: var(--surface-2);
  padding: 1px 5px;
  border-radius: 4px;
}
.hero-desc pre {
  background: var(--surface-2);
  padding: 12px 14px;
  border-radius: 8px;
  overflow-x: auto;
  font-family: var(--mono);
  font-size: 12.5px;
}
.stats { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
.stat {
  background: var(--surface-2);
  border-radius: 8px;
  padding: 10px 16px;
  min-width: 110px;
}
.stat-num { font-size: 21px; font-weight: 650; line-height: 1.2; }
.stat-lbl { font-size: 12px; color: var(--text-3); margin-top: 2px; }
.grp-title {
  font-size: 15px;
  font-weight: 650;
  margin: 34px 0 14px;
  padding-left: 11px;
  border-left: 3px solid var(--primary);
  line-height: 1.3;
}
.ep {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 20px 22px;
  margin-bottom: 16px;
}
.ep-head { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.ep-title { font-size: 16px; font-weight: 600; margin: 12px 0 4px; }
.ep-desc { color: var(--text-2); font-size: 14px; margin: 0 0 4px; }
.sec-title { font-size: 13px; font-weight: 600; color: var(--text-2); margin: 18px 0 8px; }
.m {
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .03em;
  padding: 3px 7px;
  border-radius: 5px;
  color: #fff;
  flex: 0 0 auto;
}
.m-get { background: var(--get); }
.m-post { background: var(--post); }
.m-put { background: var(--put); }
.m-patch { background: var(--patch); }
.m-delete { background: var(--delete); }
.path {
  font-family: var(--mono);
  font-size: 13.5px;
  color: var(--text);
  word-break: break-all;
}
.badge {
  display: inline-block;
  font-size: 11.5px;
  padding: 2px 8px;
  border-radius: 20px;
  font-weight: 600;
  letter-spacing: .02em;
}
.badge-auth { background: #fdeceb; color: #b3362f; }
.badge-public { background: #e8f6ee; color: #1a7a44; }
.badge-code {
  background: var(--surface-2);
  color: var(--text-2);
  font-family: var(--mono);
}
.badge-mt { background: var(--primary-soft); color: var(--primary); }
.badge-req { background: var(--surface-2); color: var(--text-2); }
.badge-成功 { background: #e8f6ee; color: #1a7a44; }
.badge-未授权 { background: #fdf3e2; color: #a3670f; }
.badge-越权 { background: #fdeceb; color: #b3362f; }
.badge-参数错误 { background: var(--primary-soft); color: var(--primary); }
.badge-错误 { background: var(--surface-2); color: var(--text-2); }
.tbl-wrap { overflow-x: auto; }
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th {
  text-align: left;
  padding: 8px 10px;
  background: var(--surface-2);
  color: var(--text-2);
  font-weight: 600;
  white-space: nowrap;
}
.tbl td { padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl tr:last-child td { border-bottom: none; }
.tbl code { font-family: var(--mono); font-size: 12px; }
.code-head {
  font-size: 12px;
  color: var(--text-2);
  margin-top: 12px;
  margin-bottom: 5px;
  font-weight: 600;
}
.code {
  margin: 0 0 4px;
  padding: 13px 15px;
  background: #f8f9fb;
  color: var(--text);
  border: 1px solid var(--line);
  border-radius: 8px;
  overflow-x: auto;
  font-family: var(--mono);
  font-size: 12.5px;
  line-height: 1.6;
}
.muted { color: var(--text-3); }
.ml8 { margin-left: 8px; }
.mt8 { margin-top: 8px; }
.tag-cards {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 12px;
  margin-top: 6px;
}
.tag-card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 12px 14px;
}
.tag-name {
  font-family: var(--mono);
  font-size: 12.5px;
  color: var(--primary);
  font-weight: 600;
}
.tag-desc { font-size: 12.5px; color: var(--text-2); margin-top: 5px; line-height: 1.6; }
@media (max-width: 900px) {
  .layout { flex-direction: column; }
  .sidebar { width: 100%; flex: none; height: auto; position: static; }
  .main { padding: 20px 16px 60px; }
}
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="side-head">
      <p class="side-title">{{title}}</p>
      <p class="side-sub">版本 {{version}} · 共 {{endpoint_count}} 个接口操作</p>
    </div>
    <div class="search-wrap">
      <input class="search" id="search" type="search" placeholder="搜索路径或名称…" autocomplete="off">
    </div>
    <nav id="nav">{{nav}}</nav>
  </aside>
  <main class="main">
    <div class="hero">
      <h1>{{title}}</h1>
      <div class="hero-meta">
        <span class="badge badge-code">v{{version}}</span>
        <span class="badge badge-public">无需安装 · 双击打开</span>
      </div>
      <div class="hero-desc">{{description_html}}</div>
      <div class="stats">
        <div class="stat"><div class="stat-num">{{endpoint_count}}</div><div class="stat-lbl">接口操作</div></div>
        <div class="stat"><div class="stat-num">{{group_count}}</div><div class="stat-lbl">功能分组</div></div>
        <div class="stat"><div class="stat-num">{{auth_count}}</div><div class="stat-lbl">需鉴权</div></div>
        <div class="stat"><div class="stat-num">{{public_count}}</div><div class="stat-lbl">公开接口</div></div>
      </div>
    </div>
    <h2 class="grp-title">分组说明</h2>
    {{tag_info}}
    {{body}}
  </main>
</div>
<script>
(function () {
  var input = document.getElementById('search');
  var items = Array.prototype.slice.call(document.querySelectorAll('.nav-item'));
  if (!input) return;
  input.addEventListener('input', function () {
    var q = input.value.trim().toLowerCase();
    items.forEach(function (el) {
      var hit = !q || (el.dataset.search || '').toLowerCase().indexOf(q) > -1;
      el.classList.toggle('hidden', !hit);
    });
  });
})();
</script>
</body>
</html>
