name: admin-web

on:
  push:
    branches: [main, master]
    paths:
      - 'admin-web/**'
      - '.github/workflows/admin-web.yml'
  pull_request:
    paths:
      - 'admin-web/**'
      - '.github/workflows/admin-web.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admin-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: ESLint / vue-tsc / Vite build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: admin-web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: admin-web/package-lock.json

      - name: Install dependencies
        run: npm ci --include=dev

      - name: ESLint
        run: npm run lint

      - name: Prettier format check
        run: npm run format:check

      - name: Type check (vue-tsc)
        run: npm run type-check

      - name: Design tokens gate
        run: npm run check:tokens

      - name: Production build
        run: npx vite build
